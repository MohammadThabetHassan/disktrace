name: Bug report
description: Report reproducible DiskTrace behavior using synthetic, non-sensitive controls.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DiskTrace. This is a public issue tracker.

        **Do not attach or paste real disk images, recovered payloads, personal data, credentials, cryptographic keys, private case records, or executable files.** Use a minimized synthetic reproduction. For a suspected security vulnerability, follow the private route in `SECURITY.md` instead of opening a public issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety confirmation
      description: Confirm that this report is safe to publish.
      options:
        - label: I used no real victim media, recovered payload, credential, key, personal data, or private case material.
          required: true
        - label: I understand that DiskTrace is local and source-read-only, and this report does not request unsupported universal, overwritten, fragmented, or TRIM recovery claims.
          required: true
  - type: input
    id: version
    attributes:
      label: DiskTrace version or commit
      description: Provide the version, package identifier, or full commit SHA.
      placeholder: "Commit: 0123456789abcdef..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: State operating system/version, architecture, package or launch path, display scale if relevant, and any relevant non-sensitive configuration.
      placeholder: |
        OS and version:
        Architecture:
        Package/build or launch command:
        Fixture/control used:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      description: Use a synthetic fixture or minimized control. Do not link to sensitive material.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected safe behavior
      description: Describe the behavior you expected under the documented method and safety boundary.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe diagnostics
      description: Include redacted text logs or screenshots only. Remove paths, identities, and case data.
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Affected workflow or method
      options:
        - Desktop workflow or keyboard navigation
        - Source identity, session, or preview boundary
        - Export, receipt, audit, or case brief
        - FAT12 or FAT16
        - exFAT contiguous deleted root
        - NTFS resident or narrow contiguous nonresident
        - PNG, JPEG, GIF, AVI, MP4/MOV, PDF, ZIP, or Open XML carving
        - Packaging or installer
        - Documentation or other
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Verification attempted
      options:
        - label: I checked the documented safety and recovery-method limits before reporting.
          required: true
        - label: I can provide a synthetic, minimized reproduction if maintainers need one.
          required: true
