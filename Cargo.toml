[workspace]
resolver = "2"
members = [
  "crates/ef-core",
  "crates/ef-catalogue",
  "crates/ef-carve",
  "crates/ef-fat",
  "crates/ef-policy",
  "crates/ef-report",
  "crates/ef-workflow",
  "crates/ef-cli",
  "crates/ef-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "=1.5.0"
hex = "0.4"
home = "=0.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "=1.24.1", features = ["v4", "serde"] }
