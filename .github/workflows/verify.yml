name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust workspace and recovery fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 xvfb

- name: Install RustSec advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

- name: Run deterministic verification matrix
        timeout-minutes: 30
        run: sh scripts/verify-all.sh
